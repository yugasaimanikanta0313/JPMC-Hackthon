name: Test and deploy to EC2

on:
  push:
    branches: [master]
  workflow_dispatch:

concurrency:
  group: production
  cancel-in-progress: true

jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.13"
          cache: pip
          cache-dependency-path: ai-service/requirements.txt
      - run: pip install -r ai-service/requirements.txt
      - run: python -m py_compile app/main.py app/rag/rag_service.py app/retrieval/hybrid_retriever.py app/services/github_app.py app/services/ingestion.py
        working-directory: ai-service
      - run: pytest -q
        working-directory: ai-service
        env:
          PYTHONPATH: .
      - uses: actions/setup-node@v4
        with:
          node-version: "20"
          cache: npm
          cache-dependency-path: frontend/package-lock.json
      - run: npm ci
        working-directory: frontend
      - run: npm run build
        working-directory: frontend

  deploy:
    needs: test
    runs-on: ubuntu-latest
    environment: production
    steps:
      - name: Configure SSH
        env:
          SSH_PRIVATE_KEY: ${{ secrets.EC2_SSH_PRIVATE_KEY }}
          EC2_HOST: ${{ secrets.EC2_HOST }}
        run: |
          install -m 700 -d ~/.ssh
          printf '%s\n' "$SSH_PRIVATE_KEY" > ~/.ssh/ec2_key
          chmod 600 ~/.ssh/ec2_key
          ssh-keyscan -H "$EC2_HOST" >> ~/.ssh/known_hosts
      - name: Deploy containers
        env:
          EC2_HOST: ${{ secrets.EC2_HOST }}
          EC2_USER: ${{ secrets.EC2_USER }}
        run: |
          ssh -i ~/.ssh/ec2_key "$EC2_USER@$EC2_HOST" <<'DEPLOY'
            set -euo pipefail
            cd /opt/barabari
            git fetch origin master
            git checkout master
            if [ -n "$(git status --porcelain --untracked-files=no)" ]; then
              git stash push -m "pre-deploy-$(date -u +%Y%m%dT%H%M%SZ)"
            fi
            git pull --ff-only origin master
            test -f .env
            available_kb=$(df --output=avail / | tail -1)
            test "$available_kb" -ge 2097152 || { echo "At least 2 GiB free disk is required before deployment"; exit 1; }
            docker compose -f docker-compose.prod.yml up -d ollama
            docker compose -f docker-compose.prod.yml exec -T ollama ollama pull qwen2.5:1.5b
            docker compose -f docker-compose.prod.yml up -d --build --remove-orphans
            docker image prune -f
            curl --fail --retry 12 --retry-delay 5 --retry-all-errors http://127.0.0.1/health
          DEPLOY
